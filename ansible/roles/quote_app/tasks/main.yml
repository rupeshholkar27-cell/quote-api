---
- name: Install Python runtime
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
    state: present
    update_cache: true

- name: Create app directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0755"

- name: Copy app.py
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../app.py"
    dest: "{{ app_dir }}/app.py"
    mode: "0644"
  notify: Restart quote-api

- name: Copy requirements.txt
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../requirements.txt"
    dest: "{{ app_dir }}/requirements.txt"
    mode: "0644"
  notify: Restart quote-api

- name: Install dependencies in a virtualenv
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: python3 -m venv

- name: Install systemd service file
  ansible.builtin.template:
    src: quote-api.service.j2
    dest: /etc/systemd/system/quote-api.service
    mode: "0644"
  notify: Restart quote-api

- name: Enable and start the service
  ansible.builtin.systemd:
    name: quote-api
    enabled: true
    state: started
    daemon_reload: true
